name: Build and deploy Node.js app to Azure Web App - gluns-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install, build, and test
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          npm ci
          npm run build
          npm run test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_185333914A9D4EBA8D10389D78AE7722 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_98381BF69644422494B4A4339B89E4E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28BCDAA7A47043EC98E20CB4F9039AA3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gluns-app'
          slot-name: 'Production'
          package: .
