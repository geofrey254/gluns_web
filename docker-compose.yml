services:
  payload:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://postgres:postgres@postgres:5432/gluns
      PAYLOAD_URL: http://localhost:3000
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3000

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: gluns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
